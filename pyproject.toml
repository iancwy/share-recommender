[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "share-recommender"
version = "0.1.0"
description = "Personal share/ETF recommender and portfolio dashboard"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["share_recommender*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["share_recommender", "tests"]
